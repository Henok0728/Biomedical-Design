version: '3.8'

services:
  backend:
    build:
      context: ./Software/backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    restart: unless-stopped

  simulator-web:
    build:
      context: ./pph-monitor/simulator
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
